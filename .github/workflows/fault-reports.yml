# Collects the anonymous fault reports that the SDL frontend and crash monitor post to a public ntfy.sh
# topic (the same topic string as in those scripts) and turns them into GitHub issues.
# A new issue is also forwarded to the maintainer's own queue through the JARVIS_REPORT_URL
# secret. The same title while its issue is open only adds a comment, so a crash loop on one
# machine stays one issue. ntfy.sh keeps messages for 12 h; this runs every 15 minutes.
name: Fault reports

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency: fault-reports

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Restore the last processed message id
        uses: actions/cache/restore@v4
        with:
          path: .ntfy-since
          key: ntfy-since-${{ github.run_id }}
          restore-keys: ntfy-since-

      - name: Turn new reports into issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JARVIS_REPORT_URL: ${{ secrets.JARVIS_REPORT_URL }}
          TOPIC: sml-faults-2356a04c1b4f5a9a12759c1a8626411d
          MAX_NEW_ISSUES: 10
        run: |
          set -euo pipefail
          since=$(cat .ntfy-since 2>/dev/null || echo 12h)
          curl -fsS --max-time 30 "https://ntfy.sh/$TOPIC/json?poll=1&since=$since" > received.jsonl
          # The public topic is untrusted. Accept only the fixed anonymous payload;
          # do not turn arbitrary logs, personal data or instructions into issues.
          jq -cs 'map(select(.event == "message" and (.message | test("^super-mario-land-port [A-Za-z0-9._+-]{1,40} (Linux aarch64|Linux x86_64|Windows x86_64) application fault$"))))[:10][]' received.jsonl > new.jsonl
          echo "$(wc -l < new.jsonl) new report(s) since $since"
          [ -s new.jsonl ] || exit 0

          gh label create fault-report --color B60205 --description "Sent automatically by super-mario-land-port" --force >/dev/null
          gh issue list --label fault-report --state open --limit 300 --json number,title > open.json
          created=0
          while IFS= read -r m <&3; do
            id=$(jq -r .id <<<"$m")
            body=$(jq -r .message <<<"$m")
            title="$body"
            title="[report] ${title:0:120}"
            when=$(date -u -d "@$(jq -r .time <<<"$m")" '+%Y-%m-%d %H:%M UTC')
            text=$(printf '%s, ntfy id `%s`\n\n~~~\n%s\n~~~\n' "$when" "$id" "${body//~~~/---}")
            num=$(jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty' open.json)
            if [ -n "$num" ]; then
              gh issue comment "$num" --body "Again: $text" >/dev/null
              echo "#$num again"
            elif [ "$created" -lt "$MAX_NEW_ISSUES" ]; then
              url=$(gh issue create --label fault-report --title "$title" --body "$text")
              created=$((created + 1))
              num=${url##*/}
              jq --arg t "$title" --argjson n "$num" '. + [{number: $n, title: $t}]' open.json > o && mv o open.json
              echo "created $url"

            else
              echo "more than $MAX_NEW_ISSUES new issues in one run, the rest waits for the next run"
              break
            fi
            # Forward both new and repeated faults. Do not advance the cursor
            # on a failed delivery: the same issue/report can safely be retried.
            url="https://github.com/$GH_REPO/issues/$num"
            if [ -n "$JARVIS_REPORT_URL" ]; then
              jq -n --arg t "${title#\[report\] }" --arg d "$url"$'\n\n'"$body" \
                '{lane: "mario", kind: "bug", title: $t, detail: $d, source: "super-mario-land-port fault report (GitHub Action)"}' |
                curl -fsS --max-time 20 -o /dev/null -X POST -H 'content-type: application/json' --data-binary @- "$JARVIS_REPORT_URL"
            else
              echo "::error::JARVIS_REPORT_URL is missing"
              exit 1
            fi
            echo "$id" > .ntfy-since
            touch .changed
          done 3< new.jsonl

      - name: Remember the last processed message id
        if: always() && hashFiles('.changed') != ''
        uses: actions/cache/save@v4
        with:
          path: .ntfy-since
          key: ntfy-since-${{ github.run_id }}
